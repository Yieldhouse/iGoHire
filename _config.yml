title: Choose Arkansas
description: >-
  Choose Arkansas unites student-athletes, fans, and business owners across
  all of Arkansas — funding opportunity, building community, and keeping
  talent right where it belongs.
url: "https://yieldhouse.github.io"
baseurl: "/Choose-Arkansas"

markdown: kramdown
permalink: /:title/

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
