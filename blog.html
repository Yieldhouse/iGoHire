---
layout: default
title: Blog
permalink: /blog/
---
<h1 class="page-title navy" style="margin-top:50px;">All Posts</h1>
<div class="blog-grid">
  {% for post in site.posts %}
  <a class="blog-card" href="{{ post.url | relative_url }}">
    {% if post.image %}<img src="{{ post.image }}" alt="{{ post.title }}">{% endif %}
    <h3>{{ post.title }}</h3>
    <p class="meta">{{ post.date | date: "%b %-d" }} · {{ post.read_time }}</p>
  </a>
  {% endfor %}
</div>
