<script>
  const header = document.getElementById('siteHeader');
  if (header) {
    window.addEventListener('scroll', () => {
      header.classList.toggle('scrolled', window.scrollY > 8);
    });
  }

  const mobileToggle = document.getElementById('mobileToggle');
  const navLinks = document.getElementById('navLinks');
  if (mobileToggle && navLinks) {
    mobileToggle.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('open');
      mobileToggle.setAttribute('aria-expanded', isOpen);
    });
  }

  const industriesBtn = document.getElementById('industriesBtn');
  const industriesDropdown = document.getElementById('industriesDropdown');
  if (industriesBtn && industriesDropdown) {
    industriesBtn.addEventListener('click', () => {
      if (window.innerWidth <= 760) {
        const isOpen = industriesDropdown.classList.toggle('open');
        const dropdown = industriesDropdown.querySelector('.dropdown');
        if (dropdown) dropdown.style.maxHeight = isOpen ? dropdown.scrollHeight + 'px' : 0;
      }
    });
  }

  window.addEventListener('resize', () => {
    if (window.innerWidth > 760) {
      if (navLinks) navLinks.classList.remove('open');
      if (industriesDropdown) {
        industriesDropdown.classList.remove('open');
        const dropdown = industriesDropdown.querySelector('.dropdown');
        if (dropdown) dropdown.style.maxHeight = '';
      }
    }
  });
</script>
