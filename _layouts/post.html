---
layout: default
---
<article class="post-content">
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%b %-d" }} · {{ page.read_time }}</p>
  {% if page.image %}<img src="{{ page.image }}" alt="{{ page.title }}" style="border-radius:14px; margin-bottom:24px;">{% endif %}
  {{ content }}
</article>
