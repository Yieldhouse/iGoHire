---
layout: default
title: Contact Us
permalink: /contactus/
---
<h1 class="page-title navy">Contact us</h1>
<form class="form-box" action="#" method="POST">
  <div class="form-full">
    <label for="c-first">First name*</label>
    <input type="text" id="c-first" name="first_name" required>
  </div>
  <div class="form-full">
    <label for="c-last">Last name</label>
    <input type="text" id="c-last" name="last_name">
  </div>
  <div class="form-full">
    <label for="c-email">Email*</label>
    <input type="email" id="c-email" name="email" required>
  </div>
  <div class="form-full">
    <label for="c-message">Write a message</label>
    <textarea id="c-message" name="message"></textarea>
  </div>
  <button class="btn btn-primary" type="submit">Submit</button>
</form>
